name: Publier le site Ryllaka Halloween
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
